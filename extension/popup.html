<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg      : #0f1117;
      --c-surface : #1a1d27;
      --c-border  : #2a2d3a;
      --c-text    : #e2e4ec;
      --c-muted   : #6b7280;
      --c-mal     : #ef4444;
      --c-mal-dim : #7f1d1d;
      --c-ben     : #22c55e;
      --c-ben-dim : #14532d;
      --c-accent  : #818cf8;
      --radius    : 8px;
      --font      : "Segoe UI", system-ui, sans-serif;
    }

    body {
      width: 340px;
      min-height: 200px;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--font);
      font-size: 13px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--c-border);
    }
    .header-title { font-weight: 600; font-size: 14px; letter-spacing: .3px; }
    .header-sub   { font-size: 10px; color: var(--c-muted); margin-top: 1px; }
    .header-right  { margin-left: auto; display: flex; gap: 6px; align-items: center; }

    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--c-muted); padding: 2px;
      border-radius: 4px; line-height: 0;
      transition: color .15s;
    }
    .icon-btn:hover { color: var(--c-text); }

    /* Card */
    .card {
      margin: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      overflow: hidden;
    }

    /* Verdict strip */
    .verdict {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }
    .verdict.malicious { background: rgba(239,68,68,.12); }
    .verdict.benign    { background: rgba(34,197,94,.10); }
    .verdict.unknown   { background: rgba(107,114,128,.10); }

    .verdict-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px;
    }
    .malicious .verdict-icon { background: var(--c-mal-dim); }
    .benign    .verdict-icon { background: var(--c-ben-dim); }
    .unknown   .verdict-icon { background: #374151; }

    .verdict-label {
      font-size: 16px; font-weight: 700; letter-spacing: .5px;
    }
    .malicious .verdict-label { color: var(--c-mal); }
    .benign    .verdict-label { color: var(--c-ben); }
    .unknown   .verdict-label { color: var(--c-muted); }
    .verdict-sub { font-size: 11px; color: var(--c-muted); margin-top: 2px; }

    /* Confidence bar */
    .conf-row {
      padding: 8px 14px 10px;
      border-top: 1px solid var(--c-border);
    }
    .conf-labels {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--c-muted); margin-bottom: 5px;
    }
    .conf-value { font-weight: 600; color: var(--c-text); }
    .bar-track {
      height: 5px; background: var(--c-border);
      border-radius: 3px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
    .malicious .bar-fill { background: var(--c-mal); }
    .benign    .bar-fill { background: var(--c-ben); }
    .unknown   .bar-fill { background: var(--c-muted); }

    /* Brand row */
    .brand-row {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-top: 1px solid var(--c-border);
      background: rgba(239,68,68,.07);
      font-size: 11px; color: var(--c-text);
    }
    .brand-icon { font-size: 13px; }

    /* URL row */
    .url-row {
      padding: 8px 14px 10px;
      border-top: 1px solid var(--c-border);
    }
    .url-label { font-size: 10px; color: var(--c-muted); margin-bottom: 3px; }
    .url-text {
      font-size: 11px; color: var(--c-text);
      word-break: break-all; max-height: 44px; overflow: hidden;
    }

    /* Explanation */
    .explain-section { margin: 0 12px 10px; }
    .explain-title {
      font-size: 11px; font-weight: 600; color: var(--c-muted);
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 6px; padding-top: 2px;
    }
    .explain-list { display: flex; flex-direction: column; gap: 5px; }

    .reason-pill {
      display: flex; align-items: flex-start; gap: 8px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .reason-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }
    .reason-dot.mal { background: var(--c-mal-dim); color: var(--c-mal); }
    .reason-dot.ben { background: var(--c-ben-dim); color: var(--c-ben); }
    .reason-text { font-size: 12px; line-height: 1.5; color: var(--c-text); }

    /* More Details button */
    .details-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 12px 12px;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      color: var(--c-muted);
      font-size: 12px;
      cursor: pointer;
      width: calc(100% - 24px);
      transition: all 0.15s;
    }
    .details-btn:hover {
      color: var(--c-accent);
      border-color: var(--c-accent);
      background: rgba(129,140,248,0.05);
    }

    /* Loading + error */
    .state-msg {
      padding: 32px 16px;
      text-align: center;
      color: var(--c-muted);
      font-size: 13px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--c-border);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Settings */
    #settings-panel {
      display: none;
      margin: 0 12px 12px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      padding: 12px;
    }
    #settings-panel label {
      font-size: 11px; color: var(--c-muted); display: block; margin-bottom: 4px;
    }
    #settings-panel input[type="text"] {
      width: 100%;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      color: var(--c-text);
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }
    #settings-panel input[type="text"]:focus { border-color: var(--c-accent); }

    /* Toggle switch */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px;
      font-size: 12px; color: var(--c-text);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--c-border);
      border-radius: 22px;
      transition: background-color 0.2s ease;
    }
    .switch-slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .switch input:checked + .switch-slider {
      background: var(--c-accent);
    }
    .switch input:checked + .switch-slider::before {
      transform: translateX(16px);
    }
    .switch input:focus-visible + .switch-slider {
      outline: 2px solid var(--c-accent);
      outline-offset: 2px;
    }

    .save-btn {
      margin-top: 8px; width: 100%;
      background: var(--c-accent); border: none;
      border-radius: 5px; color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 6px; cursor: pointer;
    }
    .save-btn:hover { filter: brightness(1.15); }
    .save-btn:active { filter: brightness(0.9); transform: scale(0.97); }

    /* Report feedback */
    .report-link {
      display: block;
      text-align: center;
      margin: 0 12px 10px;
      font-size: 11px;
      color: var(--c-muted);
      background: none; border: none; cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .report-link:hover { color: var(--c-accent); }

    #report-panel {
      display: none;
      margin: 0 12px 12px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      padding: 12px;
    }
    #report-panel .report-label {
      font-size: 11px; font-weight: 600; color: var(--c-text);
      margin-bottom: 8px;
    }
    #report-comment {
      width: 100%;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      color: var(--c-text);
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      resize: none;
      font-family: var(--font);
      min-height: 44px;
    }
    #report-comment:focus { border-color: var(--c-accent); }
    .report-submit-btn {
      margin-top: 8px; width: 100%;
      background: var(--c-mal); border: none;
      border-radius: 5px; color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 6px; cursor: pointer;
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    .report-submit-btn:hover { filter: brightness(1.15); }
    .report-submit-btn:active { filter: brightness(0.9); transform: scale(0.97); }
    .report-confirm {
      font-size: 11px; color: var(--c-ben);
      text-align: center; padding: 4px 0 0;
    }

    /* Footer */
    .footer {
      padding: 6px 14px 8px;
      border-top: 1px solid var(--c-border);
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--c-muted);
    }
    .src-badge {
      background: var(--c-border);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
       stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
  <div>
    <div class="header-title">URL Detector</div>
    <div class="header-sub">ML-powered malicious URL detection</div>
  </div>
  <div class="header-right">
    <!-- History button -->
    <button class="icon-btn" id="history-btn" title="View History">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </button>
    <!-- Settings button -->
    <button class="icon-btn" id="settings-toggle" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</div>

<!-- Main result card -->
<div id="main-content">
  <div class="state-msg">
    <div class="spinner"></div>
    Checking URL…
  </div>
</div>

<!-- Explanation -->
<div id="explain-content"></div>

<!-- More Details button (shown after result loads) -->
<button class="details-btn" id="details-btn" style="display:none;">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </svg>
  View History &amp; Statistics
</button>

<!-- Report incorrect result -->
<button class="report-link" id="report-toggle" style="display:none;">
  ⚑ This result looks wrong? Report it
</button>
<div id="report-panel">
  <div class="report-label" id="report-label">Report this verdict</div>
  <textarea id="report-comment" placeholder="Optional: why do you think this is wrong?"></textarea>
  <button class="report-submit-btn" id="report-submit">Submit Report</button>
  <div class="report-confirm" id="report-confirm" style="display:none;">✓ Thanks — report submitted</div>
</div>

<!-- Settings -->
<div id="settings-panel">
  <label for="api-url">API Base URL</label>
  <input type="text" id="api-url" placeholder="http://localhost:5000" />

  <div class="toggle-row">
    <span>Voice alert on blocked sites</span>
    <label class="switch">
      <input type="checkbox" id="voice-alerts-toggle" />
      <span class="switch-slider"></span>
    </label>
  </div>

  <button class="save-btn" id="save-settings">Save</button>
</div>

<!-- Footer -->
<div class="footer" id="footer-row" style="display:none;">
  <span>Source:</span>
  <span class="src-badge" id="src-badge">—</span>
  <span id="threshold-txt" style="margin-left:auto;"></span>
</div>

<script src="popup.js"></script>
</body>
</html>
